name: larkai
services:
  web:
    image: ${LARKAI_IMAGE:?Set an immutable LARKAI_IMAGE reference}
    env_file: .env
    environment:
      OIDC_ISSUER: ${OIDC_ISSUER:?Herkules issuer is required}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?OIDC client ID is required}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?OIDC client secret is required}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Public origin is required}
      CF_ACCESS_ISSUER: ${CF_ACCESS_ISSUER:-}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:-}
      FEISHU_MODE: live
      HOST: 0.0.0.0
      PORT: 8000
      FRONTEND_DIST: /app/frontend/dist
      DATABASE_PATH: /app/data/larkai.sqlite3
      RM_AUTO_COLLECT_SECONDS: ${RM_AUTO_COLLECT_SECONDS:-300}
    volumes:
      - data:/app/data
    networks:
      edge:
        aliases: [larkai]
    # Caddy is the only published entry point; no host port.
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8000/healthz]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped
    mem_limit: 384m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
networks:
  edge:
    external: true
    name: herkules_default
volumes:
  data:
