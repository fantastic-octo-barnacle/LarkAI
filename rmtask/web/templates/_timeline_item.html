<li class="tl-item imp-{{ e.importance }}">
  <div class="tl-meta">
    <span class="badge src-{{ e.source }}">{{ e.source }}</span>
    {% if e.ts %}<span class="muted">{{ e.ts|dt }}</span>{% endif %}
    {% if e.author %}<span class="muted">by {{ e.author }}</span>{% endif %}
  </div>
  <div class="tl-body">
    {% if e.url %}<a href="{{ e.url }}" target="_blank" rel="noopener">{{ e.title }}</a>{% else %}<b>{{ e.title }}</b>{% endif %}
    {% if e.description %}<p class="muted">{{ e.description[:240] }}</p>{% endif %}
    {% for tag in e.tags %}<span class="tag">{{ tag }}</span>{% endfor %}
  </div>
</li>
